

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: serviaires-app
    container_name: serviaires-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - serviaires-network
    depends_on:
      - mysql
      - redis
    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_URL: http://localhost:8081/
      LOG_CHANNEL: "${LOG_CHANNEL}"
      DB_CONNECTION: "${DB_CONNECTION}"
      DB_HOST: mysql
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION}"
      CACHE_DRIVER: "${CACHE_DRIVER}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION}"
      SESSION_DRIVER: "${SESSION_DRIVER}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "${REDIS_PORT}"
      MAIL_MAILER: "${MAIL_MAILER}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"

  webserver:
    image: nginx:alpine
    container_name: serviaires-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - serviaires-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: serviaires-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - serviaires-network
    ports:
      - "3307:3306"

  redis:
    image: redis:alpine
    container_name: serviaires-redis
    restart: unless-stopped
    networks:
      - serviaires-network
    ports:
      - "6380:6379"

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: serviaires-vite
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - serviaires-network
    ports:
      - "5174:5173"
    command: npm run dev -- --host

networks:
  serviaires-network:
    driver: bridge

volumes:
  dbdata:
